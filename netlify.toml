# Cadence is plain HTML, CSS and JavaScript with no build step, so Netlify
# serves the repository root as it is:
#
#   /            index.html   the homepage
#   /app         app.html     the planner
#   /demo        demo.html    the same planner with sample data
#   /privacy     privacy.html
#   /terms       terms.html
#   /contact     contact.html the contact form (Netlify Forms; see LAUNCH.md)
#   /thanks      thanks.html  where the form lands once a message is sent
#   anything else             404.html, which Netlify serves by itself
#   /robots.txt, /sitemap.xml written by scripts/stamp_pages.py
#   /api/agent   netlify/functions/agent.mjs   the assistant, server side
#   /api/visit   netlify/functions/visit.mjs   visit counts, off by default
#
# The one step before a commit that touches the site's address, who runs it,
# or a page's title: python3 scripts/stamp_pages.py. It writes those into the
# HTML, so what is served is complete without any script running.
#
# Secrets (ANTHROPIC_API_KEY and friends) are set in the Netlify UI. They are
# never written here: functions cannot read variables declared in this file,
# and this file is public.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean addresses for the pages. These are rewrites (status 200), so the
# address bar keeps /app and the files keep their relative links.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

# Old links to the app keep working. force = true because the file still
# exists (the Chrome extension loads it from its own package).
[[redirects]]
  from = "/src/panel/panel.html"
  to = "/app"
  status = 301
  force = true

[[redirects]]
  from = "/src/panel/panel"
  to = "/app"
  status = 301
  force = true

# Content-Security-Policy: only this site's own scripts run, so a title from
# Canvas or a reply from the assistant that slipped some markup past escaping
# still could not run code or send a sign-in token anywhere. The pages have no
# inline scripts and no inline event handlers; keep it that way. connect-src
# names the Supabase project in src/config.js (scripts/prelaunch_check.py
# checks they match) and Anthropic, for students who use their own key.
# frame-ancestors keeps other sites from framing Cadence; the homepage's own
# demo frame is the same site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://bfflfqtgqdlhtvwspynv.supabase.co https://api.anthropic.com; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"

# Nothing is cached hard, so a deploy is live on the next load. Cadence used to
# ship a service worker that got this wrong; sw.js now only removes itself.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
