<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cadence</title>
  <meta name="description" content="Show up for what matters — your commitments, your homework, and the people keeping you on track.">
  <meta name="theme-color" content="#fff8ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1511" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon32.png">
  <link rel="apple-touch-icon" href="../../icons/icon192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top" id="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 3.5a8.5 8.5 0 1 1-8.1 5.9"/><path d="M12 8a4 4 0 1 1-3.8 2.8"/>
          </svg>
        </span>
        <span>Cadence</span>
      </div>
      <div class="top-actions">
        <button class="streak-chip" id="streak" data-act="streak" hidden></button>
        <button class="icon-btn" id="btn-sync" title="Refresh from Canvas" aria-label="Refresh from Canvas">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="btn-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabs" aria-label="Sections"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="sheet" class="sheet">
    <form method="dialog" id="sheet-form"></form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
